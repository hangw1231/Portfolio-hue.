<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
  <style>
    :root {
      --accent: #005d6b;
      --border: #4fb0c1;
      --text: #0f1b1d;
      --muted: rgba(15, 27, 29, 0.18);
      --shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
      --radius: 24px;
      --padX: 40px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Pretendard, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .di-card {
      width: min(520px, 92vw);
      margin: 40px auto;
      padding: 44px 36px 48px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .di-title {
      margin: 0 0 28px;
      text-align: center;
      font-size: 40px;
      font-weight: 800;
      color: #3e9aa8;
      letter-spacing: -0.02em;
    }

    .di-viewport {
      position: relative;
      padding: 10px 0;
    }

    /* 공용 리스트 기본 */
    .di-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      row-gap: 24px;
    }

    .di-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 14px var(--padX);
      font-size: 28px;
      font-weight: 800;
      color: var(--muted);
      line-height: 1;
    }

    .di-item .en {
      letter-spacing: -0.02em;
    }

    .di-item .ko {
      font-weight: 700;
      font-size: 22px;
      opacity: 0.9;
    }

    /* 강조된 항목 */
    .di-item.is-active {
      color: #fff;
    }

    /* 강조 바(필) */
    .di-highlight {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 0px);
      max-width: 460px;
      height: 64px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: var(--shadow);
      opacity: 0;
      transition: transform 600ms ease, opacity 300ms ease;
      pointer-events: none;
    }

    /* ===== 웹 버전 ===== */
    @media (min-width: 769px) {
      .di-viewport {
        padding-top: 6px;
      }

      .di-highlight {
        width: 420px;
        /* 웹에서 bar 길이 */
      }
    }

    /* ===== 모바일 버전 =====
   - bar는 가운데 고정
   - 리스트가 아래->위로 올라가며 반복
   - 위/아래 키워드 살짝 보이게 viewport 높이 제한 + overflow hidden
*/
    @media (max-width: 768px) {
      .di-card {
        width: min(720px, 92vw);
        padding: 36px 28px 40px;
        border: none;
      }

      .di-title {
        font-size: 44px;
        margin-bottom: 20px;
      }

      .di-list {
        position: relative;
        z-index: 2;
        /* ⬅️ 원형바 위 */
      }


      .di-viewport {
        position: relative;
        height: 220px;
        overflow: hidden;
      }

      .di-highlight {
        position: absolute;
        inset: 0;
        margin: auto;

        width: 520px;
        max-width: 86vw;
        height: 68px;

        background: #005d6b;
        border-radius: 999px;

        z-index: 1;
        /* ⬅️ 기준 레이어 */
        opacity: 1;
      }


      .di-list {
        row-gap: 18px;
        will-change: transform;
      }

      .di-item {
        color: rgba(15, 27, 29, 0.4);
        opacity: 0.35;
        filter: blur(0.6px);
        transition: all 400ms ease;
      }

      .di-item.is-active {
        color: #ffffff;
        /* ⬅️ 무조건 흰색 */
        opacity: 1;
        filter: none;
        font-weight: 800;
      }

      .di-item .ko {
        font-size: 24px;
      }

      .di-viewport::before,
      .di-viewport::after {
        content: "";
        position: absolute;
        left: 0;
        width: 100%;
        height: 40px;
        z-index: 3;
        pointer-events: none;
      }

      .di-viewport::before {
        top: 0;
        background: linear-gradient(to bottom,
            #fff 0%,
            rgba(255, 255, 255, 0) 100%);
      }

      .di-viewport::after {
        bottom: 0;
        background: linear-gradient(to top,
            #fff 0%,
            rgba(255, 255, 255, 0) 100%);
      }

    }

    /* 모션 줄이기 */
    @media (prefers-reduced-motion: reduce) {
      .di-highlight {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <section class="di-card" aria-label="Design Identify">
    <h2 class="di-title">Design Identify</h2>

    <div class="di-viewport">
      <!-- 강조 바(필) -->
      <div class="di-highlight" aria-hidden="true"></div>

      <!-- 키워드 리스트 -->
      <ul class="di-list" id="diList">
        <li class="di-item"><span class="en">Aesthetic</span><span class="ko">감각적인</span></li>
        <li class="di-item"><span class="en">Intuitive</span><span class="ko">직관적인</span></li>
        <li class="di-item"><span class="en">On-trend</span><span class="ko">트렌디한</span></li>
        <li class="di-item"><span class="en">Subtle</span><span class="ko">차분한</span></li>
        <li class="di-item"><span class="en">Minimal</span><span class="ko">미니멀한</span></li>
        <li class="di-item"><span class="en">Functional</span><span class="ko">기능적인</span></li>
      </ul>
    </div>
  </section>

  <script>
    const list = document.getElementById("diList");
    const highlight = document.querySelector(".di-highlight");

    const mqMobile = window.matchMedia("(max-width: 768px)");

    let timer = null;
    let positions = [];
    let index = 0;

    const stayTime = 2600;      // 각 키워드 머무는 시간
    const moveDuration = 600;   // 이동 애니메이션 시간(웹 바 / 모바일 리스트)

    // 유틸: 타이머/상태 초기화
    function cleanup() {
      if (timer) clearInterval(timer);
      timer = null;
      index = 0;

      // active 초기화
      list.querySelectorAll(".di-item").forEach(li => li.classList.remove("is-active"));

      // 모바일에서 복제해둔 경우 원복
      if (list.dataset.cloned === "1") {
        const originalCount = Number(list.dataset.originalCount || 0);
        const items = Array.from(list.children);
        items.slice(originalCount).forEach(node => node.remove());
        delete list.dataset.cloned;
        delete list.dataset.originalCount;
      }

      // transform 초기화
      list.style.transition = "none";
      list.style.transform = "translateY(0px)";
      highlight.style.transition = ""; // CSS 기본으로 복귀
      highlight.style.opacity = 0;
      highlight.style.transform = "translateX(-50%)";
    }

    // ========== WEB: 바가 내려가는 방식 ==========
    function initWeb() {
      const items = Array.from(list.querySelectorAll(".di-item"));

      function calcPositions() {
        const hH = highlight.offsetHeight || 64;
        positions = items.map((item) => {
          const top = item.offsetTop;
          const h = item.offsetHeight;
          return top + (h / 2) - (hH / 2);
        });
      }

      function moveTo(i, withTransition = true) {
        items.forEach(el => el.classList.remove("is-active"));
        items[i].classList.add("is-active");

        if (!withTransition) highlight.style.transition = "none";
        else highlight.style.transition = `transform ${moveDuration}ms ease, opacity 300ms ease`;

        highlight.style.opacity = 1;
        highlight.style.transform = `translate(-50%, ${positions[i]}px)`;

        // transition 복구(다음 이동을 위해)
        if (!withTransition) {
          void highlight.offsetWidth; // reflow
          highlight.style.transition = `transform ${moveDuration}ms ease, opacity 300ms ease`;
        }
      }

      // 최초 세팅
      calcPositions();
      moveTo(0);

      // 루프
      timer = setInterval(() => {
        index += 1;

        if (index >= items.length) {
          // 끝에 도달 → 자연스럽게 처음으로 점프(transition 제거)
          index = 0;
          moveTo(0, false);
        } else {
          moveTo(index, true);
        }
      }, stayTime);

      // 리사이즈 시 위치 재계산
      window.addEventListener("resize", () => {
        calcPositions();
        moveTo(index, false);
      }, { passive: true });
    }

    // ========== MOBILE: 바 고정 + 리스트가 올라가는 방식 ==========
    function initMobile() {
      const originalItems = Array.from(list.querySelectorAll(".di-item"));
      const originalCount = originalItems.length;

      // 무한루프용 복제(뒤에 한 세트 더 붙임)
      originalItems.forEach(li => list.appendChild(li.cloneNode(true)));
      list.dataset.cloned = "1";
      list.dataset.originalCount = String(originalCount);

      const items = Array.from(list.querySelectorAll(".di-item"));

      function setActive(i) {
        items.forEach(el => el.classList.remove("is-active"));
        items[i].classList.add("is-active");
      }


      // 중앙 바가 있는 위치에 "가운데 아이템"이 오도록 y 계산
      function getStep() {
        // item 높이 + gap(대략 row-gap)
        // 정확히 하려면 실제 offsetTop 차이를 사용
        const a = items[0];
        const b = items[1];
        return b.offsetTop - a.offsetTop;
      }

      function setActive(i) {
        // 활성화는 "원본 인덱스" 기준으로만 표시해도 OK
        items.forEach(el => el.classList.remove("is-active"));
        items[i].classList.add("is-active");
      }

      // 시작: 0번을 중앙에 맞추기
      const viewport = document.querySelector(".di-viewport");
      const centerY = viewport.clientHeight / 2;
      const firstItemCenter = items[0].offsetTop + items[0].offsetHeight / 2;
      const baseOffset = centerY - firstItemCenter; // 0번이 중앙 오도록 하는 offset

      let step = getStep();

      function moveTo(i, withTransition = true) {
        if (withTransition) {
          list.style.transition = `transform ${moveDuration}ms ease`;
        } else {
          list.style.transition = "none";
        }

        const y = baseOffset - (step * i);
        list.style.transform = `translateY(${y}px)`;

        setActive(i);

        if (!withTransition) {
          void list.offsetWidth;
          list.style.transition = `transform ${moveDuration}ms ease`;
        }
      }

      // 모바일은 바 고정이라 opacity 항상 1
      highlight.style.opacity = 1;

      moveTo(0, false);

      timer = setInterval(() => {
        index += 1;

        // 원본 끝까지 갔다가(예: 0~5) → 복제 구간(6~11)으로 자연스럽게 넘어감
        // 그리고 index가 originalCount에 도달하면 "점프"로 0으로 되돌림(transition 없이)
        if (index >= originalCount + 1) {
          // 안전장치(혹시 넘어가면)
          index = 0;
          moveTo(0, false);
          return;
        }

        moveTo(index, true);

        // index가 원본 마지막 다음(=originalCount)으로 가면
        // 화면상으론 "원본 0"과 동일한 복제 0이 보임 → 이 타이밍에 점프
        if (index === originalCount) {
          setTimeout(() => {
            index = 0;
            moveTo(0, false);
          }, moveDuration + 20);
        }
      }, stayTime);

      window.addEventListener("resize", () => {
        // 리사이즈 시 기준값 재계산
        step = getStep();

        const newCenterY = viewport.clientHeight / 2;
        const newFirstCenter = items[0].offsetTop + items[0].offsetHeight / 2;
        const newBase = newCenterY - newFirstCenter;

        // baseOffset을 갱신하기 위해 클로저 변수 대신 재할당
        // (간단히: transform을 다시 계산)
        // 여기선 즉시 점프로 맞춰주기
        const y = newBase - (step * index);
        list.style.transition = "none";
        list.style.transform = `translateY(${y}px)`;
        void list.offsetWidth;
      }, { passive: true });
    }

    // ========== 분기 실행 ==========
    function boot() {
      cleanup();
      if (mqMobile.matches) initMobile();
      else initWeb();
    }

    boot();
    mqMobile.addEventListener("change", boot);

  </script>

</body>

</html>
